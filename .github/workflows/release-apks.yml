# Builds the Android APKs, the Linux AppImage (also for the Steam Deck) and
# the Windows zip, and publishes them as one GitHub Release whenever the version in
# pubspec.yaml changes on master (tool/release_apks.sh,
# tool/build_appimage.sh).
# Needs these repository secrets, from the upload key:
#   ANDROID_KEYSTORE_BASE64  the .jks file, base64-encoded
#   ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release APKs

on:
  push:
    branches: [master]
    paths: ['pubspec.yaml']
  workflow_dispatch:
    inputs:
      latest:
        description: 'Publish as the latest full release (not a pre-release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-apks
  cancel-in-progress: false

jobs:
  # pubspec.yaml also changes for dependencies: release only versions
  # that have no release yet.
  version:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.version.outputs.new }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for a new version
        id: version
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
  linux:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux build tools
        # The runner's LLVM brings libunwind-14-dev, which blocks
        # libunwind-dev, a dependency of GStreamer's headers.
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good patchelf file

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Build the AppImage
        run: |
          flutter pub get
          tool/build_appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: build/release/*.AppImage
          if-no-files-found: error

  # A zip of the app's folder, with the Visual C++ runtime next to the .exe
  # so it runs on PCs that don't have it. Unsigned: SmartScreen warns once.
  windows:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Build the zip
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          $app = 'build\release\Coba Lagi'
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item -Recurse 'build\windows\x64\runner\Release\*' $app
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $app
          }
          Compress-Archive -Path $app -DestinationPath 'build\release\CobaLagi-Windows-x64.zip'

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build/release/*.zip
          if-no-files-found: error

  # The checks, the APKs, the AppImage and the zip build side by side; the
  # release waits for all of them.
  checks:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Run the checks
        run: |
          flutter pub get
          dart format --set-exit-if-changed .
          flutter analyze
          flutter test

  android:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Set up the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The upload key secrets are not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build the APKs
        run: |
          flutter pub get
          tool/release_apks.sh --build-only

      - name: Remove the upload key
        if: always()
        run: rm -f android/app/upload.jks android/key.properties

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  release:
    needs: [version, checks, android, linux, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: appimage
          path: build/release

      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: build/release

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: build/app/outputs/flutter-apk

      - name: Publish
        run: |
          if [ "${{ inputs.latest }}" = "true" ]; then
            tool/release_apks.sh --skip-build --latest
          else
            tool/release_apks.sh --skip-build
          fi
