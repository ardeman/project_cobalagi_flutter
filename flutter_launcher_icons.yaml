# App icons for every platform, generated from branding/ by:
#   dart run flutter_launcher_icons
# Edit the SVGs in branding/, then run branding/render.sh (renders and generates).
flutter_launcher_icons:
  image_path: branding/icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: branding/icon_background.png
  adaptive_icon_foreground: branding/icon_foreground.png
  adaptive_icon_monochrome: branding/icon_monochrome.png
  # The art already sits inside Android's safe zone, so no extra padding.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  # iOS 18+ dark and tinted home screens: the head alone on a clear
  # background, so the system draws its own dark or tinted backdrop.
  image_path_ios_dark_transparent: branding/icon_foreground.png
  image_path_ios_tinted_grayscale: branding/icon_foreground.png
  desaturate_tinted_to_grayscale_ios: true
  web:
    generate: true
    image_path: branding/icon.png
    background_color: "#f47a52"
    theme_color: "#f47a52"
  macos:
    generate: true
    image_path: branding/icon.png
  windows:
    generate: true
    image_path: branding/icon.png
    icon_size: 256
