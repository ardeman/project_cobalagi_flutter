name: cobalagi
description: "Coba Lagi: a coding-learning app for children."
publish_to: 'none'

# x.y.z+build → Android versionName+versionCode, iOS CFBundleShortVersionString+CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  audioplayers: ^6.7.1
  flame: ^1.38.2
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  in_app_purchase: ^3.3.1 # Android/iOS only; web stays on the free plan
  intl: ^0.20.2
  path_provider: ^2.1.6 # native only; web storage uses sembast_web
  sembast: ^3.8.7
  sembast_web: ^2.4.4+1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/en/
    - assets/audio/id/
    - assets/config/
    - assets/levels/
