name: cobalagi
description: "Coba Lagi: a coding-learning app for children."
publish_to: 'none'

# x.y.z+build → Android versionName+versionCode, iOS CFBundleShortVersionString+CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  audioplayers: ^6.7.1
  cupertino_icons: ^1.0.8
  flame: ^1.38.2
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  intl: ^0.20.2
  path_provider: ^2.1.6 # native only; web storage uses sembast_web
  sembast: ^3.8.7
  sembast_web: ^2.4.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/config/
    - assets/levels/
